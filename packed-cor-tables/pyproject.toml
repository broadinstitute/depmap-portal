[tool.poetry]
name = "packed-cor-tables"
version = "0.3.0"
description = "Library for reading/writing compressed correlation tables"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
pandas = ">=1.1.0"
# no real direct dependency on numpy, but pandas 1 is dependent on numpy <2, so if pandas < 2 is installed for testing pick this numpy version
# numpy = ">=1.26.3" # no real direct dependency; supports both numpy 1.x and 2.x

[[tool.poetry.source]]
name = "public-python"
url = "https://us-central1-python.pkg.dev/cds-artifacts/public-python/simple/"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pyright = "^1.1.393"
pytest = "^8.3.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
